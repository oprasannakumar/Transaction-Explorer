<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

/* ===== BASE ===== */
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#eef2f7,#f9fafb);
  padding:12px;
}

.card{
  max-width:100%;
  margin:auto;
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 12px 28px rgba(0,0,0,.08);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.controls{
  display:flex;
  gap:8px;
}

input,button{
  height:36px;
  padding:0 10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:13px;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover{background:#1e40af}

/* ===== TABLE GRID ===== */
.table-wrap{
  margin-top:14px;
  overflow-x:hidden;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:4px;   /* compact spacing */
  font-size:12px;
  table-layout:fixed;
}

th{
  background:#f8fafc;
  font-weight:600;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:6px;
  text-align:left;
}

td{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:8px 10px;
  word-wrap:break-word;
  word-break:break-word;
  white-space:normal;
  max-width:160px;
}

tr:hover td{
  background:#eef2f7;
}

.empty{
  text-align:center;
  padding:20px;
  color:#6b7280;
}

/* ===== FILTER ALIGNMENT FIX ===== */
.filter-box{
  position:relative;
  width:100%;
}

.filter-box > input{
  width:100%;
  height:28px;
  padding:4px 8px;
  font-size:11px;
  border-radius:6px;
  border:1px solid #d1d5db;
  background:#fff;
}

/* ===== FILTER DROPDOWN ===== */
.filter-dropdown{
  position:absolute;
  top:32px;
  left:0;
  width:200px;
  background:#fff;
  border:1px solid #d1d5db;
  border-radius:8px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
  z-index:100;
  display:none;
}

.filter-header{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  font-size:10px;
}

.filter-header span{
  color:#2563eb;
  cursor:pointer;
}

.filter-search{
  width:100%;
  padding:6px 8px;
  border:none;
  border-bottom:1px solid #e5e7eb;
  outline:none;
  font-size:12px;
}

.filter-list{
  max-height:160px;
  overflow:auto;
  padding:6px;
}

.filter-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:3px;
  font-size:12px;
}
.filter-item:hover{background:#f1f5f9}

.filter-count{
  font-size:10px;
  padding:4px 8px;
  color:#6b7280;
}

/* ===== MOBILE VIEW ===== */
@media (max-width:768px){

  table, thead, tbody, th, tr{
    display:block;
  }

  thead{
    display:none;
  }

  tbody tr{
    background:#fff;
    margin-bottom:14px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
  }

  tbody td{
    display:flex;
    justify-content:space-between;
    border:1px solid #e5e7eb;
    margin:6px 0;
    background:#f9fafb;
    padding:8px 10px;
    font-size:13px;
  }

  tbody td::before{
    content:attr(data-label);
    font-weight:600;
    color:#374151;
    padding-right:10px;
    flex:1;
  }

  tbody td{
    flex:2;
    text-align:right;
  }

  .filter-dropdown{
    width:90vw;
    max-width:320px;
  }

  input,button{
    height:42px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch</button>
    </div>
  </div>

  <div class="table-wrap" id="result">
    <div class="empty">Select date range</div>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx7UZ48h0TvA53h3dP0mAqwM2yz88bngxYctvJOJ_OKLuHOcllc7IPZAxGN3N0U0lQJ/exec";

let fullData=[], columns=[], filters={};

function fetchData(){
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  if(!from||!to){alert("Select both dates");return;}

  fetch(`${API_URL}?from=${from}&to=${to}`)
    .then(r=>r.json())
    .then(d=>{
      if(d.error){alert(d.error);return;}
      fullData=d;
      columns=Object.keys(d[0]||{});
      filters={};
      renderTable();
    });
}

function renderTable(){
  if(!fullData.length){
    result.innerHTML=`<div class="empty">No transactions found</div>`;
    return;
  }

  let html=`<table><thead><tr>`;
  columns.forEach(c=>html+=`<th>${c.replace(/_/g,' ')}</th>`);
  html+=`</tr><tr>`;

  columns.forEach(c=>{
    html+=`
    <th>
      <div class="filter-box">
        <input readonly placeholder="Filter" onclick="toggleFilter(event,'${c}')">
        <div class="filter-dropdown" id="dd-${c}" onclick="event.stopPropagation()">
          <div class="filter-header">
            <span onclick="selectAll('${c}')">Select all</span>
            <span onclick="clearFilter('${c}')">Clear</span>
          </div>
          <input class="filter-search" placeholder="Search"
                 oninput="searchFilter('${c}',this.value)">
          <div class="filter-list" id="list-${c}"></div>
          <div class="filter-count" id="count-${c}"></div>
        </div>
      </div>
    </th>`;
  });

  html+=`</tr></thead><tbody id="tbody"></tbody></table>`;
  result.innerHTML=html;

  columns.forEach(initFilter);
  renderRows(fullData);
}

/* ===== SORT & DATE ===== */
function smartSort(values,col){
  if(col.toLowerCase().includes("date")){
    return values.sort((a,b)=>parseDate(a)-parseDate(b));
  }
  if(values.every(v=>!isNaN(v))){
    return values.sort((a,b)=>Number(a)-Number(b));
  }
  return values.sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
}

function parseDate(str){
  if(!str) return new Date(0);
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)){
    const [y,m,d]=str.split("-");
    return new Date(y,m-1,d);
  }
  const m=str.match(/^(\d{1,2})-([A-Za-z]{3}|\d{1,2})-(\d{4})$/);
  if(!m) return new Date(0);
  const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const month=isNaN(m[2])?months[m[2]]:m[2]-1;
  return new Date(m[3],month,m[1]);
}

/* ===== FILTER ===== */
function initFilter(col){
  let values=[...new Set(fullData.map(r=>r[col]).filter(v=>v))];
  values=smartSort(values,col);

  filters[col]=new Set();
  const list=document.getElementById(`list-${col}`);
  list.innerHTML=values.map(v=>`
    <label class="filter-item">
      <input type="checkbox"
             onclick="event.stopPropagation()"
             onchange="toggleValue('${col}','${encodeURIComponent(v)}')">
      ${v}
    </label>`).join("");

  document.getElementById(`count-${col}`).textContent=`Displaying ${values.length}`;
}

function toggleFilter(e,col){
  e.stopPropagation();
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.style.display="none");
  document.getElementById(`dd-${col}`).style.display="block";
}

function toggleValue(col,val){
  val=decodeURIComponent(val);
  filters[col].has(val)?filters[col].delete(val):filters[col].add(val);
  applyFilters();
}

function applyFilters(){
  renderRows(fullData.filter(r=>{
    return Object.keys(filters).every(c=>{
      if(!filters[c].size) return true;
      return filters[c].has(r[c]);
    });
  }));
}

function renderRows(data){
  tbody.innerHTML=data.map(r=>
    `<tr>${columns.map(c=>{
      const v=r[c];
      return `<td data-label="${c.replace(/_/g,' ')}">${v!==undefined&&v!==null&&v!==""?v:"—"}</td>`;
    }).join("")}</tr>`
  ).join("");
}

function searchFilter(col,term){
  term=term.toLowerCase();
  document.querySelectorAll(`#list-${col} label`)
    .forEach(l=>l.style.display=l.innerText.toLowerCase().includes(term)?"":"none");
}

function selectAll(col){
  const vals=[...new Set(fullData.map(r=>r[col]).filter(v=>v))];
  filters[col]=new Set(vals);
  document.querySelectorAll(`#list-${col} input`).forEach(i=>i.checked=true);
  applyFilters();
}

function clearFilter(col){
  filters[col].clear();
  document.querySelectorAll(`#list-${col} input`).forEach(i=>i.checked=false);
  applyFilters();
}

/* CLOSE FILTER ON OUTSIDE CLICK */
document.addEventListener("click",()=>{
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.style.display="none");
});
</script>

</body>
</html>
