<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Command Center | v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: rgba(30, 41, 59, 0.5);
            --surface-bright: rgba(51, 65, 85, 0.8);
            --primary: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.3);
            --success: #10b981;
            --danger: #f43f5e;
            --gold: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(12px);
        }
.filter-trigger {
        font-size: 9px;
        padding: 4px;
        border-radius: 4px;
        background: rgba(255,255,255,0.05);
        transition: 0.2s;
        cursor: pointer;
    }.filter-trigger:hover {
        background: var(--primary);
        color: var(--bg);
    }
.id-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: rgba(14, 165, 233, 0.1);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--primary-glow);
    /* 🔥 Fix: Prevent text wrapping */
    white-space: nowrap; 
    display: inline-block;
    letter-spacing: 0.5px;
    /* Optional: subtle glow effect */
    box-shadow: 0 0 10px rgba(14, 165, 233, 0.1);
}    
    /* Ensure Reference Data column stands out */
    .ref-data {
        color: var(--gold);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
    }
    /* Fixed Dropdown Position */
 .filter-dropdown {
        position: absolute;
        top: 100%;     /* Directly below the header text */
        right: 10px;   /* Small offset from the right edge of the header */
        background: #1e293b !important;
        border: 1px solid var(--primary);
        padding: 12px;
        display: none;
        border-radius: 10px;
        min-width: 180px;
        z-index: 1000; /* Ensure it's on top of everything */

    }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #030712 100%); 
            color: var(--text); 
            margin: 0;

        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-bright); border-radius: 10px; }

        .container { max-width: 1500px; margin: auto; }

        #status { 
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; 
            letter-spacing: 2px;

        /* --- Futuristic Stat Cards --- */
        .dashboard {

            margin-bottom: 24px;

        .stat-card {

.header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 8px;
    }        .stat-card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); opacity: 0; transition: 0.3s;
        }

        .stat-card.interactive:hover {
            transform: translateY(-5px);

        }

        .stat-card .label { font-size: 10px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card .value { font-size: 26px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }

        /* Cash Breakdown Grid */
       #cash-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); /* 3 narrow columns */
    gap: 6px; 
    margin-top: 12px; 
}
        .denom-tile {
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 10px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
    transition: 0.2s;
    /* This makes the card narrow and clean */
    min-width: 80px; 
}/* Color Coding for specific denominations */
.denom-tile[data-v="500"] { border-left: 3px solid #fbbf24; } /* Gold */
.denom-tile[data-v="200"] { border-left: 3px solid #f472b6; } /* Pink */
.denom-tile[data-v="100"] { border-left: 3px solid #60a5fa; } /* Blue */
.denom-tile[data-v="50"]  { border-left: 3px solid #4ade80; } /* Green */
.denom-tile[data-v="20"]  { border-left: 3px solid #a78bfa; } /* Purple */
.denom-tile:not([data-v="500"]):not([data-v="200"]):not([data-v="100"]):not([data-v="50"]):not([data-v="20"]) { 
    border-left: 3px solid var(--text-muted); 
}

        /* --- Unified Toolbar --- */
        .toolbar {
            background: var(--surface);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 24px;

            align-items: center;
            gap: 16px;

            top: 20px;

            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);

            padding: 10px 14px;
            border-radius: 10px;

        select:focus, input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-glow); }

        /* --- Table Container --- */
.sheet-card {
    background: var(--surface);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--card-shadow);
}

        .table-search-box {

            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;

        }
thead th {

    top: 0;

    z-index: 50;

}
.table-wrap {
    max-height: 60vh;

    overflow-x: auto; /* 🔥 Ensure this is set to auto */
    position: relative;

}
thead tr {
    position: sticky;
    top: 0;
}
thead {
    position: sticky;
    top: 0;
    z-index: 100;
}      table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
}
tbody {
    position: relative;
    z-index: 1;
}
        denom-tile:hover {
    background: var(--surface-bright);
    transform: scale(1.05);
    border-color: var(--primary);
}

        td { padding: 14px 20px; font-size: 13px; border-bottom: 1px solid var(--border); }

        .data-row { transition: 0.2s; }
        .data-row:hover { background: rgba(255,255,255,0.03); }
        .data-row.selected { background: rgba(14, 165, 233, 0.15) !important; color: var(--primary); }

        /* --- Buttons --- */
        button {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;

            transition: all 0.3s;

        .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 6px 20px 0 var(--primary-glow); }

        .btn-red { background: rgba(244, 63, 94, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .btn-red:hover { background: var(--danger); color: white; }

        /* --- Processing Overlay --- */
        #processing-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(8px);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner {
            width: 50px; height: 50px; border: 3px solid transparent;
            border-top-color: var(--primary); border-right-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
.denom-value { color: #a2b4f9; font-weight: 600; font-size: 12px; }

        /* Pill Metrics */
        .metric-pill { background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border); }

<body>
<div id="processing-overlay">
    <div class="spinner"></div>
    <div id="overlay-text" style="margin-top:20px; font-weight: 800; letter-spacing: 3px; color: var(--primary);">INITIALIZING SYSTEM...</div>
</div>

<div class="container">
    <div id="status">System Online // Vijayawada Node</div>

    <div class="dashboard">
        <div class="stat-card interactive" onclick="viewNamedRange('Savings')">
            <span class="label">Liquidity Pool</span>
            <div class="value" style="color: var(--success);" id="net-val">₹0</div>
        </div>
        <div class="stat-card interactive" onclick="viewNamedRange('CC')">
            <span class="label">Credit Exposure</span>
            <div class="value" style="color: var(--danger);" id="debt-val">₹0</div>
        </div>
        <div class="stat-card">
            <span class="label">Net Position</span>
            <div class="value" style="color: var(--primary);" id="total-available">₹0</div>
        </div>
        <div class="stat-card">
            <span class="label">Cash Assets <span id="cash-total" style="color:var(--gold); float:right;">₹0</span></span>
            <div id="cash-grid"></div>
        </div>
    </div>

    <div class="toolbar">
        <div class="controls-group">
            <select id="monthSelect" onchange="autoFillDates()">
                <option value="">Select Month</option>
                <option value="0">January</option><option value="1">February</option>
                <option value="2">March</option><option value="3">April</option>
                <option value="4">May</option><option value="5">June</option>
                <option value="6">July</option><option value="7">August</option>
                <option value="8">September</option><option value="9">October</option>
                <option value="10">November</option><option value="11">December</option>
            </select>
            <input type="number" id="yearSelect" value="2026" onchange="autoFillDates()" style="width: 70px;">
            <input type="date" id="start">
            <input type="date" id="end">
            <button class="btn-blue" onclick="loadMain()">Execute Search</button>
            <button class="btn-accent" onclick="loadFullStatement()">Full History</button>
        </div>
        <div id="action-buttons-holder" style="display: flex; gap: 8px;"></div>
    </div>

    <div id="displayArea"></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxeyI-iKfYu216UnB-6HBW1uuIwTzjykzOdLXaWK2JzxEl7XUF5ytr9hYWKmq4Batdtgg/exec';
    let navStack = []; // Global history tracker
    let currentViewType = 'Savings'; 
	let currentTableMode = 'statement'; // 'registry' | 'statement'

function updateToolbarMetrics(headers, rows) {
  const inflowEl = document.getElementById('bar-inflow');
  const outflowEl = document.getElementById('bar-outflow');

  if (!inflowEl || !outflowEl) return; // ← PREVENT CRASH

  let inflow = 0, outflow = 0;
  const inIdx = headers.findIndex(h => /deposit amount/i.test(h));
  const outIdx = headers.findIndex(h => /withdrawn amount/i.test(h));

  rows.forEach(row => {
    if (inIdx !== -1) inflow += parseFloat(row[inIdx]?.toString().replace(/[^0-9.-]/g, "") || 0);
    if (outIdx !== -1) outflow += parseFloat(row[outIdx]?.toString().replace(/[^0-9.-]/g, "") || 0);
  });

  inflowEl.innerText = '₹' + inflow.toLocaleString('en-IN');
  outflowEl.innerText = '₹' + outflow.toLocaleString('en-IN');
}

    function formatTacticalDate(dateStr) {
    if (!dateStr || dateStr === "") return "-";
    const date = new Date(dateStr);
    if (isNaN(date)) return dateStr; // Return as-is if it's not a date

    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const day = date.getDate();
    const month = months[date.getMonth()];
    const year = date.getFullYear();

    return `${day}-${month}-${year}`;
}

function autoFillDates() {
    const month = document.getElementById('monthSelect').value;
    const year = document.getElementById('yearSelect').value;

    if (month === "") return;

    // 1. Get the first day of the selected month
    const firstDay = new Date(year, month, 1);
    
    // 2. Get the last day of the selected month
    // Setting day to '0' of the next month correctly gets the last day of the current month
    const lastDay = new Date(year, parseInt(month) + 1, 0);

    // 3. Precise Formatting Helper (Prevents Timezone shifting)
    const toLocalISO = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    };

    // Update the actual inputs
    document.getElementById('start').value = toLocalISO(firstDay);
    document.getElementById('end').value = toLocalISO(lastDay);
    
    // Log for debugging (Check your browser console if it still acts up)
    console.log(`Command Center: Range set to ${toLocalISO(firstDay)} through ${toLocalISO(lastDay)}`);
}

function loadFullStatement() {
    const startInput = document.getElementById('start');
    const endInput = document.getElementById('end');
    
    // Set range to a wide window
    startInput.value = "2020-01-01";
    
    const today = new Date().toISOString().split('T')[0];
    endInput.value = today;

    // Reuse your existing main fetch logic
    loadMain();
}

function setProcessing(isProcessing, message = "EXECUTING...") {
    const overlay = document.getElementById('processing-overlay');
    const status = document.getElementById('status');
    const overlayText = document.getElementById('overlay-text');

    if (isProcessing) {
        overlay.style.display = 'flex';
        overlayText.innerText = message.toUpperCase();
        status.classList.add('status-pulsing');
        status.innerText = message;
    } else {
        overlay.style.display = 'none';
        status.classList.remove('status-pulsing');
    }
}
  

window.onload = async () => {
    try {
        const res = await fetch(`${SCRIPT_URL}?action=getDashboard`);
        const data = await res.json();
        
        // Update raw values
        document.getElementById('net-val').innerText = '₹' + data.liquidity.toLocaleString('en-IN');
        document.getElementById('debt-val').innerText = '₹' + data.debt.toLocaleString('en-IN');
        
        // Calculate Net Position (Liquidity - Debt)
        const netPosition = data.liquidity - data.debt;
        const netEl = document.getElementById('total-available');
        netEl.innerText = '₹' + netPosition.toLocaleString('en-IN');
        
        // Dynamic color for Net Position (Red if negative, blue/green if positive)
        netEl.style.color = netPosition < 0 ? 'var(--danger)' : 'var(--primary)';

        // Update Cash
        document.getElementById('cash-total').innerText = '₹' + data.cashBreakdown[10].toLocaleString('en-IN');
        
        const denoms = [500, 200, 100, 50, 20, 10, 5, 2, 1];
        let html = "";
        denoms.forEach((v, i) => {
            const count = data.cashBreakdown[i+1] || 0;
           html += `<div class="denom-tile" data-v="${v}">
                        <span class="denom-value">₹${v}</span>
                        <span class="denom-count">${count}</span>
                    </div>`;
        });
        document.getElementById('cash-grid').innerHTML = html;
        
    } catch(e) { 
        document.getElementById('status').innerText = "Sync Failed"; 
    }
};
    async function loadMain() {
    const s = document.getElementById('start').value, e = document.getElementById('end').value;
    if(!s || !e) return alert("Select dates");
    
    setProcessing(true, "Retrieving Ledger Data...");
    try {
        const res = await fetch(`${SCRIPT_URL}?action=getList&start=${s}&end=${e}`);
        const data = await res.json();
        renderTable(data.headers, data.rows);
        updateToolbarMetrics(data.headers, data.rows);
        setProcessing(false);
        document.getElementById('status').innerText = "Sync Complete";
    } catch(e) { 
        setProcessing(false);
        document.getElementById('status').innerText = "Sync Error"; 
    }
}

    // Shared table rendering logic
function renderTable(headers, rows) {
    const isRegistry = currentTableMode === 'registry';
    
    // 1. Identify key columns dynamically
    // We look for ID/Reference to use as the system key, and Ref_No for visual highlighting
    let idColIdx = headers.findIndex(h => /id|ref_id|reference/i.test(h));
    const dataRefIdx = headers.findIndex(h => /ref_no/i.test(h));

    // Fallback: If no ID column found, assume the last column is the internal ID
    if (idColIdx === -1) idColIdx = headers.length - 1;

    let html = `
    <div class='sheet-card'>
        <div class="table-search-box">
            <div style="display:flex; align-items:center; gap:15px; flex-grow:1;">
                <input type="text" id="tableFilter" placeholder="Search Terminal..." onkeyup="applyMultiFilter()" style="max-width:300px;">
                <span id="rowCount" style="font-family:'JetBrains Mono'; font-size:11px; color:var(--text-muted);">READY_</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <div class="metric-pill">
                    <span class="pill-label">Inflow</span>
                    <span class="pill-val" id="bar-inflow" style="color: var(--success);">₹0</span>
                </div>
                <div class="metric-pill">
                    <span class="pill-label">Outflow</span>
                    <span class="pill-val" id="bar-outflow" style="color: var(--danger);">₹0</span>
                </div>
            </div>
        </div>

        <div class='table-wrap'>
            <table id="mainDataTable">
                <thead>
                    <tr>
                        ${headers.map((h, i) => {
                            // Generate a clean field name for the mapping logic
                            const fieldName = h.toLowerCase().replace(/\s+/g, '_');
                            return `
                            <th data-col-name="${fieldName}" style="position: relative;">
                                <div class="header-content">
                                    <span>${h}</span>
                                    <span class="filter-trigger" onclick="toggleFilterDropdown(event, '${fieldName}')">▼</span>
                                </div>
                                <div id="filter-dropdown-${fieldName}" class="filter-dropdown">
                                    <div id="options-container-${fieldName}" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
                                    <div style="display:flex; gap:5px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
                                        <button class="btn-blue" style="font-size:9px; flex:1; height:24px;" onclick="applyMultiFilter()">Apply</button>
                                        <button class="btn-accent" style="font-size:9px; flex:1; height:24px;" onclick="clearFilter('${fieldName}')">Clear</button>
                                    </div>
                                </div>
                            </th>`;
                        }).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(row => {
                        // 2. Extract and Clean the Reference ID for the row attribute
                        const rawId = row[idColIdx];
                        const rowId = (rawId !== undefined && rawId !== null) ? String(rawId).trim() : "";
                        
                        // Determine click behavior (Registry vs Statement)
                        const clickAction = isRegistry 
                            ? `filterLedgerByEntity('${row[0]}')` 
                            : `handleRowClick(this)`;

                        return `
                            <tr class="data-row" data-id="${rowId}" onclick="${clickAction}">
                                ${row.map((cell, idx) => {
                                    const fieldName = headers[idx].toLowerCase().replace(/\s+/g, '_');
                                    let content = cell ?? '';
                                    
                                    // 3. Apply Conditional Formatting
                                    const isIdCol = idx === idColIdx;
                                    const isRefData = idx === dataRefIdx;
                                    const isDate = /date/i.test(headers[idx]);
                                    const isAmount = /amount|withdrawn|deposit|total/i.test(headers[idx]);

                                    if (isIdCol && !isRegistry) {
                                        // Futuristic Badge for IDs
                                        content = `<span class="id-badge">${cell}</span>`;
                                    } else if (isRefData) {
                                        // Gold text for external Bank References
                                        content = `<span class="ref-data">${cell}</span>`;
                                    } else if (isDate) {
                                        content = formatTacticalDate(cell);
                                    }

                                    return `
                                        <td data-field="${fieldName}" style="${isAmount ? 'font-family:JetBrains Mono; font-weight:600;' : ''} ${isIdCol ? 'min-width:130px;' : ''}">
                                            ${content}
                                        </td>`;
                                }).join('')}
                            </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>
    </div>`;

    // 4. Inject into DOM and run post-render scripts
    document.getElementById('displayArea').innerHTML = html;
    populateFilterOptions(headers, rows);
    updateToolbarMetrics(headers, rows);
    
    // Auto-calculate the Inflow/Outflow for the loaded view
    recalculateMetricsFromVisible();
}

function applyMultiFilter() {
    const query = document.getElementById('tableFilter').value.toLowerCase();
    const table = document.getElementById('mainDataTable');
    const rows = Array.from(table.querySelectorAll('.data-row'));

    const activeFilters = {};
    document.querySelectorAll('.col-filter-check:checked').forEach(check => {
        const field = check.getAttribute('data-field-target'); // ✅ CORRECT
        if (!activeFilters[field]) activeFilters[field] = [];
        activeFilters[field].push(check.value.toLowerCase().trim());
    });

    let visibleCount = 0;

    rows.forEach(row => {
        const cells = Array.from(row.querySelectorAll('td'));
        const matchesQuery =
            query === "" ||
            cells.some(c => c.textContent.toLowerCase().includes(query));

        let matchesFilters = true;
        for (const field in activeFilters) {
            const cell = row.querySelector(`td[data-field="${field}"]`);
            const cellText = cell ? cell.textContent.toLowerCase().trim() : "";
            if (!activeFilters[field].includes(cellText)) {
                matchesFilters = false;
                break;
            }
        }

        if (matchesQuery && matchesFilters) {
            row.style.display = "";
            visibleCount++;
        } else {
            row.style.display = "none";
        }
    });

    document.getElementById('rowCount').innerText = `MATCH: ${visibleCount}`;
}

function handleRowClick(rowElement) {
    // 1. Toggle the visual class
    rowElement.classList.toggle('selected');
    
    // 2. Refresh the action buttons (Trace/Purge)
    toggleButtons();

    // 3. Update the Inflow/Outflow based on selection
    recalculateMetricsFromSelected();
}
let activeFilters = {};

function toggleFilterDropdown(event, fieldName) {
    event.stopPropagation();
    const dropdown = document.getElementById(`filter-dropdown-${fieldName}`);
    const isVisible = dropdown.style.display === 'block';
    
    // Hide all other dropdowns
    document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none');
    
    // Toggle current
    dropdown.style.display = isVisible ? 'none' : 'block';
}
function populateFilterOptions(headers, rows) {
    headers.forEach((h, i) => {
        const fieldName = h.toLowerCase().replace(/\s+/g, '_');
        const uniqueValues = [...new Set(rows.map(r => r[i]))].sort();
        const container = document.getElementById(`options-container-${fieldName}`);
        
        if (container) {
            container.innerHTML = uniqueValues.map(val => `
                <div style="display:flex; align-items:center; gap:8px; padding:4px; font-size:11px;">
                    <input type="checkbox" class="col-filter-check" data-field-target="${fieldName}" value="${val}" onchange="applyMultiFilter()">
                    <span>${val}</span>
                </div>`).join('');
        }
    });
}
function applyMultiFilter() {
    const query = document.getElementById('tableFilter').value.toLowerCase();
    const table = document.getElementById('mainDataTable');
    const rows = Array.from(table.querySelectorAll('.data-row'));
    
    // Gather all active filters by Field Name
    const activeFilters = {};
    document.querySelectorAll('.col-filter-check:checked').forEach(check => {
        const field = check.getAttribute('data-field-target');
        if (!activeFilters[field]) activeFilters[field] = [];
        activeFilters[field].push(check.value.toLowerCase().trim());
    });

    let visibleCount = 0;
    rows.forEach(row => {
        const cells = Array.from(row.querySelectorAll('td'));
        const matchesQuery = query === "" || cells.some(c => c.textContent.toLowerCase().includes(query));
        
        let matchesFilters = true;
        for (const field in activeFilters) {
            const cell = row.querySelector(`td[data-field="${field}"]`);
            const cellText = cell ? cell.textContent.toLowerCase().trim() : "";
            if (!activeFilters[field].includes(cellText)) {
                matchesFilters = false;
                break;
            }
        }

        if (matchesQuery && matchesFilters) {
            row.style.display = "";
            visibleCount++;
        } else {
            row.style.display = "none";
        }
    });
    
    document.getElementById('rowCount').innerText = `MATCH: ${visibleCount}`;
    recalculateMetricsFromVisible();
}
function clearFilter(fieldName) {
    document
        .querySelectorAll(`.col-filter-check[data-field-target="${fieldName}"]`)
        .forEach(c => (c.checked = false));

    applyMultiFilter();
}

// Close dropdowns when clicking outside
document.addEventListener('click', () => {
    document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none');
});

function applyTableFilter() {
    const input = document.getElementById('tableFilter');
    const filter = input.value.toLowerCase();
    const table = document.getElementById('mainDataTable');
    const rows = table.getElementsByClassName('data-row');
    let visibleCount = 0;

    for (let i = 0; i < rows.length; i++) {
        const cells = rows[i].getElementsByTagName('td');
        let found = false;
        
        // Start loop from index 1 to skip the checkbox column
        for (let j = 1; j < cells.length; j++) {
            const content = cells[j].textContent || cells[j].innerText;
            if (content.toLowerCase().indexOf(filter) > -1) {
                found = true;
                break;
            }
        }

        if (found) {
            rows[i].classList.remove('row-hidden');
            visibleCount++;
        } else {
            rows[i].classList.add('row-hidden');
        }
    }
    
    // Update the row count display
    document.getElementById('rowCount').innerText = `Showing ${visibleCount} records`;
    
    // Recalculate Toolbar Metrics based on VISIBLE rows only
    recalculateMetricsFromVisible();
}

// Optional: Dynamic metrics update while filtering
function recalculateMetricsFromSelected() {
    const table = document.getElementById('mainDataTable');
    if (!table) return;

    const selectedRows = Array.from(table.getElementsByClassName('selected'));
    
    // 🔥 FIX: If no rows are selected, fallback to calculating total visible data
    if (selectedRows.length === 0) {
        recalculateMetricsFromVisible();
        return;
    }

    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.toLowerCase());
    const inIdx = headers.findIndex(h => h.includes('deposit'));
    const outIdx = headers.findIndex(h => h.includes('withdrawn'));

    let inflow = 0, outflow = 0;

    selectedRows.forEach(row => {
        const cells = row.getElementsByTagName('td');
        if (inIdx !== -1) {
            let val = cells[inIdx].innerText.replace(/[^0-9.-]/g, "");
            inflow += parseFloat(val) || 0;
        }
        if (outIdx !== -1) {
            let val = cells[outIdx].innerText.replace(/[^0-9.-]/g, "");
            outflow += parseFloat(val) || 0;
        }
    });

    // Update UI
    document.getElementById('bar-inflow').innerText = '₹' + inflow.toLocaleString('en-IN');
    document.getElementById('bar-outflow').innerText = '₹' + outflow.toLocaleString('en-IN');
    document.getElementById('rowCount').innerText = `${selectedRows.length} RECORDS SELECTED`;
}

async function fetchAssociated() {
    const selectedRows = document.querySelectorAll('.data-row.selected');
    
    // Extract IDs and clean them
    const ids = Array.from(selectedRows)
        .map(r => r.getAttribute('data-id'))
        .filter(id => id && id !== "null" && id !== "undefined" && id.length > 0);
    
    if (!ids.length) {
        alert("CRITICAL: No valid Reference IDs found.");
        return;
    }

    setProcessing(true, "TRACING SYSTEM REFERENCES...");
    
    // 🔥 FIX: Hide action buttons immediately when entering Trace View
    document.getElementById('action-buttons-holder').innerHTML = "";

    try {
        const res = await fetch(`${SCRIPT_URL}?action=fetchAssociated&ids=${encodeURIComponent(ids.join(','))}`);
        const grouped = await res.json();
        
        let finalHtml = `
            <div style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:center;">
                <button class="btn-blue" onclick="loadMain()" style="background:var(--surface-bright); color:white; border: 1px solid var(--primary);">
                    <span style="font-size:16px;">←</span> EXIT_TRACE_MODE
                </button>
                <div class="metric-pill">
                    <span class="pill-label">ACTIVE_SCAN_TARGETS</span>
                    <span class="pill-val" style="color:var(--primary)">${ids.join(' // ')}</span>
                </div>
            </div>`;
        
        let foundAnyData = false;

        for (const sheetName in grouped) {
            const sheet = grouped[sheetName];
            if (sheet.headers && sheet.rows && sheet.rows.length > 0) {
                foundAnyData = true;
                finalHtml += `
                    <div class="sheet-card" style="margin-bottom:32px; border: 1px solid var(--primary-glow);">
                        <div class="table-search-box" style="background: rgba(14, 165, 233, 0.05); padding: 15px 20px;">
                            <span class="label" style="color:var(--primary); font-size:11px; letter-spacing:2px;">SOURCE_MODULE: ${sheetName.toUpperCase()}</span>
                            <div class="metric-pill" style="border:none; background:transparent;">
                                <span class="pill-label">MATCHES</span>
                                <span class="pill-val" style="font-size:18px;">${sheet.rows.length}</span>
                            </div>
                        </div>
                        <div class="table-wrap" style="max-height: 400px; overflow:auto;">
                            <table>
                                <thead style="position:sticky; top:0; z-index:10;">
                                    <tr>${sheet.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${sheet.rows.map(r => `
                                        <tr class="data-row-static"> ${r.map((cell, idx) => {
                                                const isDate = /date/i.test(sheet.headers[idx]);
                                                const isAmount = /amount|total|balance|deposit|withdrawn/i.test(sheet.headers[idx]);
                                                return `<td style="${isAmount ? 'font-family:JetBrains Mono; font-weight:700; color:var(--gold);' : ''}">
                                                            ${isDate ? formatTacticalDate(cell) : (cell ?? "")}
                                                        </td>`;
                                            }).join('')}
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
            }
        }

        if (!foundAnyData) {
            finalHtml += `<div class="stat-card" style="text-align:center; padding:80px; border: 2px dashed var(--border);">
                            <div class="label">TRACE_RESULT: NULL</div>
                            <button class="btn-blue" onclick="loadMain()" style="margin:20px auto 0;">RETURN</button>
                          </div>`;
        }

        document.getElementById('displayArea').innerHTML = finalHtml;
        setProcessing(false);
        document.getElementById('status').innerText = "TRACE_COMPLETE";
        
    } catch(e) { 
        setProcessing(false);
        document.getElementById('status').innerText = "TRACE_ERROR";
    }
}

async function deleteRecords() {
    const ids = Array.from(document.querySelectorAll('.data-row.selected')).map(r => r.getAttribute('data-id'));
    if (!ids.length || !confirm(`GLOBAL PURGE: Delete ${ids.length} records?`)) return;

    setProcessing(true, "Executing Purge...");

    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'deleteRows', ids: ids })
        });

        // Simulating sync time for animation effect
        setTimeout(async () => {
            await window.onload(); 
            const s = document.getElementById('start').value;
            const e = document.getElementById('end').value;
            if (s && e) await loadMain();
            
            setProcessing(false);
            document.getElementById('status').innerText = "Terminal Synced.";
        }, 1500);

    } catch(e) { 
        setProcessing(false);
        document.getElementById('status').innerText = "Purge Failed"; 
    }
}

   function toggleButtons() {
    const selectedRows = document.querySelectorAll('.data-row.selected');
    const holder = document.getElementById('action-buttons-holder');
    const count = selectedRows.length;

    if (count > 0) {
        // If they don't exist yet, create them
        if (!document.getElementById('fetchBtn')) {
            holder.innerHTML = `
                <button class="btn-accent" id="fetchBtn" onclick="fetchAssociated()">Trace ID (${count})</button>
                <button class="btn-red" id="deleteBtn" onclick="deleteRecords()">Purge (${count})</button>
            `;
        } else {
            // If they already exist, just update the numbers
            document.getElementById('fetchBtn').innerText = `Trace ID (${count})`;
            document.getElementById('deleteBtn').innerText = `Purge (${count})`;
        }
    } else {
        // If no rows are selected, wipe them from the DOM entirely
        holder.innerHTML = "";
    }
}

async function copyRowToClipboard(rowElement) {
    const table = document.getElementById('mainDataTable');
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.trim());
    const cells = Array.from(rowElement.querySelectorAll('td')).map(td => td.innerText.trim());

    // Mapping headers to indices
    const getVal = (regex) => {
        const idx = headers.findIndex(h => regex.test(h));
        return idx !== -1 ? cells[idx] : "";
    };

    const date = getVal(/date/i);
    const narration = getVal(/narration/i);
    const spentFor = getVal(/spent for/i);
    const withdrawn = getVal(/withdrawn amount/i).replace(/[^0-9.]/g, "");
    const deposit = getVal(/deposit amount/i).replace(/[^0-9.]/g, "");
    const account = getVal(/from\/ to/i);
    const ref = getVal(/reference/i);

    // Determine Logic
    const isDebit = parseFloat(withdrawn) > 0;
    const amount = isDebit ? withdrawn : deposit;
    const type = isDebit ? "Debit" : "Credit";

    const formattedText = 
`📅 Date: ${date}
👤 Name: ${spentFor}
📝 Msg: ${narration}
💰 Amount: ${amount}
⇄ Type: ${type}
🏢 Account: ${account}
🔗 Ref: ${ref}`;

    try {
        await navigator.clipboard.writeText(formattedText);
        
        // Visual Feedback
        const originalBg = rowElement.style.background;
        rowElement.style.background = "var(--success)";
        const statusMsg = document.getElementById('status');
        const oldStatus = statusMsg.innerText;
        statusMsg.innerText = "📋 ROW COPIED TO CLIPBOARD";
        
        setTimeout(() => {
            rowElement.style.background = originalBg;
            statusMsg.innerText = oldStatus;
        }, 1500);
    } catch (err) {
        alert("Failed to copy text: " + err);
    }
}
function recalculateMetricsFromVisible() {
    const table = document.getElementById('mainDataTable');
    if (!table) return;

    const rows = Array.from(table.querySelectorAll('.data-row'));
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.toLowerCase());
    
    const inIdx = headers.findIndex(h => h.includes('deposit'));
    const outIdx = headers.findIndex(h => h.includes('withdrawn'));

    let inflow = 0, outflow = 0, visibleCount = 0;

    rows.forEach(row => {
        if (row.style.display !== "none") {
            visibleCount++;
            const cells = row.getElementsByTagName('td');
            if (inIdx !== -1) {
                let val = cells[inIdx].innerText.replace(/[^0-9.-]/g, "");
                inflow += parseFloat(val) || 0;
            }
            if (outIdx !== -1) {
                let val = cells[outIdx].innerText.replace(/[^0-9.-]/g, "");
                outflow += parseFloat(val) || 0;
            }
        }
    });

    document.getElementById('bar-inflow').innerText = '₹' + inflow.toLocaleString('en-IN');
    document.getElementById('bar-outflow').innerText = '₹' + outflow.toLocaleString('en-IN');
    document.getElementById('rowCount').innerText = `MATCH: ${visibleCount}`;
}
