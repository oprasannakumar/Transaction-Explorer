<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0; font-family:'Inter',sans-serif; background:#f3f6fb; padding:12px;}
  .card{background:#fff; border-radius:16px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,.05); max-width: 1400px; margin: auto;}
  .header{display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; margin-bottom: 20px;}
  .controls{display:flex; gap:10px; align-items: center; flex-wrap: wrap;}
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
  .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; }
  .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600; }
  .stat-value { font-size: 18px; font-weight: 700; color: #0f172a; margin-top: 5px; }
  .sheet-group { margin-bottom: 30px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fff; }
  .sheet-header { background: #0f172a; color: #fff; padding: 10px 15px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
  
  input, button { height: 38px; padding: 0 15px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 13px; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
  button:hover:not(:disabled) { background: #1e40af; transform: translateY(-1px); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; color: #64748b; }
  
  .btn-delete { background: #ef4444; }
  .btn-delete:hover:not(:disabled) { background: #dc2626; }
  .btn-trace-bulk { background: #10b981; }
  .btn-trace-bulk:hover:not(:disabled) { background: #059669; }
  
  .count-badge { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f8fafc; padding: 12px 15px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #475569; }
  td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; word-break: break-word; }
  
  @media(max-width:768px){
    .header { flex-direction: column; align-items: flex-start; }
    table, thead, tbody, th, tr { display: block; }
    thead { display: none; }
    tbody td { display: flex; justify-content: space-between; padding: 8px 0; border: none; }
    tbody td::before { content: attr(data-label); font-weight: 600; color: #64748b; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch Data</button>
      <button id="traceBtn" onclick="traceSelected()" class="btn-trace-bulk" disabled>
        Trace Selected <span id="trace-count" class="count-badge">0</span>
      </button>
      <button id="deleteBtn" onclick="deleteSelected()" class="btn-delete" disabled>
        Delete Selected <span id="del-count" class="count-badge">0</span>
      </button>
    </div>
  </div>

  <div id="summary" class="summary-bar" style="display:none;">
    <div class="stat-card"><div class="stat-label">Total Deposits</div><div id="total-dep" class="stat-value">₹0.00</div></div>
    <div class="stat-card"><div class="stat-label">Total Withdrawals</div><div id="total-with" class="stat-value">₹0.00</div></div>
    <div class="stat-card"><div class="stat-label">Net Balance</div><div id="total-net" class="stat-value">₹0.00</div></div>
  </div>

  <div id="result">Please select a date range.</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw4x4_aevBLrEuWiHFex84Cz_EiFuThFPO5jgxWaGUYQYOTsbNHIPhUe8KJ1GVpLX9zfg/exec";
let deleteSet = new Set();
let actionState = "fetch";

function formatDate(dateStr) {
  const date = new Date(dateStr);
  if (isNaN(date.getTime())) return dateStr; 
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return `${date.getDate()}-${months[date.getMonth()]}-${date.getFullYear()} (${days[date.getDay()]})`;
}

function parseAmount(v){
  return parseFloat(String(v||"").replace(/[₹,]/g,"")) || 0;
}

async function fetchData() {
  actionState = "fetch";
  const from = document.getElementById("from").value, to = document.getElementById("to").value;
  if(!from || !to) return alert("Select dates");
  renderLoading("Fetching data...");
  try {
    const r = await fetch(`${API_URL}?from=${from}&to=${to}`, { redirect: "follow" });
    renderData(await r.json());
    resetButtons(); // Clear counts on new fetch
  } catch(e) { renderMsg("Error fetching data.", true); }
}

async function traceSelected() {
  if (deleteSet.size === 0) return;
  const ids = Array.from(deleteSet).join(",");
  actionState = "trace";
  renderLoading(`Tracing ${deleteSet.size} Reference(s)...`);
  try {
    const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(ids)}`, { redirect: "follow" });
    renderData(await r.json());
  } catch(e) { renderMsg("Error tracing IDs.", true); }
}

function renderData(data) {
  if(!data || data.length === 0) return renderMsg("No records found.");
  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "";
  let gDep = 0, gWith = 0;

  const grouped = data.reduce((acc, item) => {
    if(!acc[item.SheetSource]) acc[item.SheetSource] = [];
    acc[item.SheetSource].push(item.data);
    return acc;
  }, {});

  Object.keys(grouped).forEach(sheetName => {
    const rows = grouped[sheetName];
    const headers = rows[0].map(pair => pair.k); 

    const container = document.createElement("div");
    container.className = "sheet-group";
    container.innerHTML = `
      <div class="sheet-header"><span>📄 Sheet: ${sheetName}</span><span>${rows.length} records</span></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" onclick="toggleSheet(this, '${sheetName}')"></th>
              ${headers.map(h => `<th>${h}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${rows.map(rowPairs => {
              const refId = rowPairs[rowPairs.length - 1].v;
              return `<tr>
                <td><input type="checkbox" class="cb-${sheetName}" data-ref="${refId}" onchange="updateSelection()"></td>
                ${rowPairs.map((pair, i) => {
                  let val = pair.v;
                  if(i === 0 || pair.k.toLowerCase().includes("date")) val = formatDate(val);
                  if(pair.k.toLowerCase().includes("deposit")) gDep += parseAmount(val);
                  if(pair.k.toLowerCase().includes("withdraw")) gWith += parseAmount(val);
                  return `<td data-label="${pair.k}">${val || "—"}</td>`;
                }).join("")}
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
    resultDiv.appendChild(container);
  });
  updateSummary(gDep, gWith);
}

function updateSummary(dep, withdr) {
  document.getElementById("summary").style.display = "grid";
  document.getElementById("total-dep").innerText = `₹${dep.toLocaleString('en-IN', {minimumFractionDigits:2})}`;
  document.getElementById("total-with").innerText = `₹${withdr.toLocaleString('en-IN', {minimumFractionDigits:2})}`;
  document.getElementById("total-net").innerText = `₹${(dep - withdr).toLocaleString('en-IN', {minimumFractionDigits:2})}`;
}

function updateSelection() {
  deleteSet.clear();
  document.querySelectorAll('input[data-ref]:checked').forEach(cb => {
    const ref = cb.getAttribute("data-ref");
    if(ref && ref !== "—") deleteSet.add(ref);
  });
  
  const dBtn = document.getElementById("deleteBtn");
  const tBtn = document.getElementById("traceBtn");
  const dCount = document.getElementById("del-count");
  const tCount = document.getElementById("trace-count");
  
  const count = deleteSet.size;
  dCount.innerText = tCount.innerText = count;
  
  dBtn.disabled = tBtn.disabled = (count === 0);
}

function resetButtons() {
  deleteSet.clear();
  updateSelection();
}

function toggleSheet(master, sName) {
  document.querySelectorAll(`.cb-${sName}`).forEach(cb => cb.checked = master.checked);
  updateSelection();
}

async function deleteSelected() {
  const ids = Array.from(deleteSet);
  if(!confirm(`Delete ${ids.length} records permanently?`)) return;
  try {
    await fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ ids: ids }) });
    alert("Deleted successfully!"); location.reload();
  } catch(e) { alert("Error deleting."); }
}

function renderMsg(m, isErr) { document.getElementById("result").innerHTML = `<div style="text-align:center; padding:40px; color:${isErr?'red':'#64748b'};">${m}</div>`; }
function renderLoading(m) { document.getElementById("result").innerHTML = `<div style="text-align:center; padding:40px; color:#2563eb; font-weight:600;">${m}</div>`; }
</script>
</body>
</html>
