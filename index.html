<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Finance OS | Clean Date Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { 
    --neon-blue: #00d2ff; --neon-cyan: #00ffff; --neon-red: #ff0055; --neon-green: #00ff88;
    --cyber-black: #05060a; --border: rgba(0, 210, 255, 0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Inter', sans-serif; background: var(--cyber-black); color: #fff; min-height: 100vh; padding: 20px; 
    background-image: linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .wrapper { max-width: 1440px; margin: 0 auto; position: relative; z-index: 10; }
  
  .top-nav { 
    backdrop-filter: blur(20px); background: rgba(10, 11, 16, 0.9); border-radius: 12px; padding: 20px 30px; 
    display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); 
    margin-bottom: 30px; position: sticky; top: 10px; z-index: 1000;
  }
  .brand { display: flex; align-items: center; gap: 15px; }
  .brand h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--neon-blue); cursor: pointer; }
  
  .filter-hub { display: flex; gap: 10px; }
  input[type="date"] { background: #000; border: 1px solid var(--neon-blue); border-radius: 5px; color: #fff; padding: 8px; font-family: 'JetBrains Mono'; }
  
  button { 
    background: var(--neon-blue); color: #000; font-weight: 800; padding: 10px 20px; border: none; border-radius: 5px; 
    cursor: pointer; font-family: 'Orbitron'; font-size: 11px; transition: 0.2s;
  }
  
  #back-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); display: none; }
  #action-btn { background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); display: none; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
  .neon-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); padding: 20px; border-radius: 10px; transition: 0.3s; cursor: pointer; }
  .neon-card:hover { border-color: var(--neon-cyan); background: rgba(0, 210, 255, 0.1); }
  .label { font-size: 9px; letter-spacing: 2px; color: var(--neon-cyan); font-weight: 700; text-transform: uppercase; }
  .value { font-family: 'Orbitron'; font-size: 22px; margin-top: 8px; }

  .container { background: rgba(0,0,0,0.5); border-radius: 15px; border: 1px solid var(--border); padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: 'Orbitron'; color: var(--neon-cyan); padding: 15px; text-align: left; border-bottom: 2px solid var(--border); font-size: 10px; background: #05060a; position: sticky; top: 0; }
  td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; vertical-align: middle; }
  
  .row-selectable { cursor: pointer; transition: 0.2s; }
  .row-selectable:hover { background: rgba(0, 210, 255, 0.08); }
  .row-selected { background: rgba(0, 210, 255, 0.2) !important; border-left: 4px solid var(--neon-cyan); }
  .row-traced { cursor: default; }

  .date-cell { font-family: 'JetBrains Mono', monospace; color: var(--neon-blue); font-weight: 700; white-space: nowrap; }
  
  .bank-tag { 
    display: inline-flex; flex-direction: column; align-items: flex-start;
    padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; 
    border: 1px solid currentColor; background: rgba(0, 0, 0, 0.6);
    line-height: 1.1; min-width: 90px; white-space: nowrap; margin: 4px 0;
  }
  .bank-tag span { font-size: 8px; opacity: 0.7; margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; }

  .tag-hdfc { color: var(--neon-blue); }
  .tag-sbi { color: var(--neon-green); }
  .tag-icici { color: #ffa500; }

  .amt-dep { color: var(--neon-green); } 
  .amt-with { color: var(--neon-red); }
  .empty { text-align: center; padding: 80px; color: var(--neon-blue); font-family: 'Orbitron'; opacity: 0.6; }
</style>
</head>
<body onload="initDashboard()">

<div class="wrapper">
  <nav class="top-nav">
    <div class="brand">
      <button id="back-btn" onclick="goBack()">BACK</button>
      <h1 onclick="location.reload()">FINANCE SYSTEM</h1>
    </div>
    <div class="filter-hub">
      <input type="date" id="from"> <input type="date" id="to">
      <button onclick="fetchData()">FETCH MASTER</button>
      <button id="action-btn" onclick="executeFinalTrace()">TRACE SELECTED (<span id="count">0</span>)</button>
    </div>
  </nav>

  <section class="metrics-grid">
    <div class="neon-card" onclick="fetchRegistry('Savings')"><div class="label">Liquidity Pool</div><div id="raw-savings" class="value">₹0.00</div></div>
    <div class="neon-card" onclick="fetchRegistry('CC')"><div class="label">Credit Exposure</div><div id="raw-cc" class="value">₹0.00</div></div>
    <div class="neon-card" style="border: 1px solid var(--neon-blue); cursor:default;"><div class="label" style="color:var(--neon-blue)">Net Balance</div><div id="net-balance" class="value">₹0.00</div></div>
    <div class="neon-card" style="cursor:default;"><div class="label">Inflow</div><div id="total-dep" class="value amt-dep">₹0.00</div></div>
    <div class="neon-card" style="cursor:default;"><div class="label">Outflow</div><div id="total-with" class="value amt-with">₹0.00</div></div>
  </section>

  <main id="result" class="container">
    <div class="empty">SYSTEM READY // AWAITING COMMAND</div>
  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxeyI-iKfYu216UnB-6HBW1uuIwTzjykzOdLXaWK2JzxEl7XUF5ytr9hYWKmq4Batdtgg/exec";

let navStack = [];
let selectionSet = new Set();
let currentViewState = 'INIT';
let currentRange = '';
let currentStats = { net: 0, rawS: 0, rawC: 0 };

async function initDashboard() {
  const r = await fetch(API_URL, { redirect: "follow" });
  const res = await r.json();
  currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
  updateUI(0, 0);
}

function pushToStack(type, data, range = '') {
  navStack.push({ type: currentViewState, data: document.getElementById("result").innerHTML, range: currentRange, sel: new Set(selectionSet) });
  currentViewState = type;
  currentRange = range;
  document.getElementById("back-btn").style.display = "block";
}

function goBack() {
  if (navStack.length === 0) return;
  const prev = navStack.pop();
  currentViewState = prev.type;
  currentRange = prev.range;
  selectionSet = prev.sel;
  document.getElementById("result").innerHTML = prev.data;
  if (navStack.length === 0) document.getElementById("back-btn").style.display = "none";
  updateBtn();
}

async function fetchData() {
  pushToStack('MASTER', '');
  selectionSet.clear(); updateBtn();
  const f = document.getElementById("from").value, t = document.getElementById("to").value;
  if(!f || !t) return;
  renderLoad("DECRYPTING MASTER DATABASE...");
  const r = await fetch(`${API_URL}?from=${f}&to=${t}`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

async function fetchRegistry(name) {
  pushToStack('REGISTRY', '', name);
  selectionSet.clear(); updateBtn();
  renderLoad(`SCANNING ${name} REGISTRY...`);
  const r = await fetch(`${API_URL}?rangeName=${name}`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

async function fetchStatement(val) {
  pushToStack('STATEMENT', '');
  selectionSet.clear(); updateBtn();
  renderLoad(`GENERATING STATEMENT FOR: ${val}...`);
  const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(val)}&source=${(currentRange === 'CC') ? 'CC' : 'Account'}`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

function handleRowClick(rowElement, refId) {
  if (currentViewState === 'TRACED') return;
  if (currentViewState === 'REGISTRY') { fetchStatement(refId); return; }
  
  if (selectionSet.has(refId)) {
    selectionSet.delete(refId);
    rowElement.classList.remove('row-selected');
  } else {
    selectionSet.add(refId);
    rowElement.classList.add('row-selected');
  }
  updateBtn();
}

async function executeFinalTrace() {
  const terms = Array.from(selectionSet).join(",");
  pushToStack('TRACED', '');
  renderLoad(`LINKING NEURAL PATHWAYS...`);
  const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(terms)}&source=Reference`, { redirect: "follow" });
  const res = await r.json();
  selectionSet.clear();
  renderData(res.transactions);
}

function renderData(data) {
  const resultDiv = document.getElementById("result");
  if(!data || data.length === 0) return resultDiv.innerHTML = "<div class='empty'>DATA NOT FOUND</div>";
  resultDiv.innerHTML = "";
  let gDep = 0, gWith = 0;
  
  updateBtn();
  const grouped = data.reduce((acc, item) => { if(!acc[item.SheetSource]) acc[item.SheetSource] = []; acc[item.SheetSource].push(item.data); return acc; }, {});

  Object.keys(grouped).forEach(sheet => {
    const rows = grouped[sheet], headers = rows[0].map(p => p.k);
    const div = document.createElement("div");
    div.innerHTML = `<div style="font-family:'Orbitron'; color:var(--neon-cyan); margin: 25px 0 10px 0; font-size: 11px;">> ${currentViewState}: ${sheet.toUpperCase()}</div>
    <div style="overflow-x:auto;"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row => {
      const refId = row[row.length - 1].v;
      const primaryVal = row[0].v;
      const passId = (currentViewState === 'REGISTRY') ? primaryVal : refId;
      const rowClass = (currentViewState === 'TRACED') ? "row-traced" : "row-selectable";
      
      return `<tr class="${rowClass}" onclick="handleRowClick(this, '${passId}')">${row.map((p, i) => {
        let val = p.v, cls = "";
        
        // --- STRICT DATE LOGIC (No Currency Format Here) ---
        if(i === 0 || p.k.toLowerCase().includes("date")) { 
            val = formatDate(val); 
            cls = "date-cell"; 
        }
        else if(p.k.toLowerCase().includes('from') || p.k.toLowerCase().includes('account')) {
           let valStr = String(val);
           let tagCls = valStr.toLowerCase().includes('hdfc') ? 'tag-hdfc' : 
                        valStr.toLowerCase().includes('sbi') ? 'tag-sbi' : 'tag-icici';
           let pts = valStr.split(' ');
           val = `<div class="bank-tag ${tagCls}">${pts[0]}${pts[1] ? `<span>${pts.slice(1).join(' ')}</span>` : ''}</div>`;
        }
        // Apply currency only to non-date numeric columns
        else if (!isNaN(parseFloat(String(val).replace(/[₹, \s]/g, "")))) {
            val = formatCurr(val);
        }
        
        if(p.k.toLowerCase().includes("deposit")) { gDep += parse(p.v); cls = "amt-dep"; }
        if(p.k.toLowerCase().includes("withdraw")) { gWith += parse(p.v); cls = "amt-with"; }
        return `<td class="${cls}">${val || "—"}</td>`;
      }).join("")}</tr>`;
    }).join("")}</tbody></table></div>`;
    resultDiv.appendChild(div);
  });
  updateUI(gDep, gWith);
}

function updateBtn() {
  const btn = document.getElementById("action-btn");
  if (selectionSet.size > 0 && currentViewState !== 'TRACED' && currentViewState !== 'REGISTRY') {
    btn.style.display = "inline-flex";
    document.getElementById("count").innerText = selectionSet.size;
  } else { btn.style.display = "none"; }
}

function updateUI(d, w) {
  document.getElementById("raw-savings").innerText = formatCurr(currentStats.rawS);
  document.getElementById("raw-cc").innerText = formatCurr(currentStats.rawC);
  document.getElementById("net-balance").innerText = formatCurr(currentStats.net);
  document.getElementById("total-dep").innerText = formatCurr(d);
  document.getElementById("total-with").innerText = formatCurr(w);
}

function formatCurr(v) { 
  let n = parseFloat(String(v || "").replace(/[₹, \s]/g, "")); 
  return isNaN(n) ? v : "₹" + n.toLocaleString('en-IN', { minimumFractionDigits: 2 }); 
}

function formatDate(d) { 
  let val = String(d || "").trim();
  let dayNum = parseInt(val);
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  
  if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31 && !val.includes("/") && !val.includes("-")) {
      return `${dayNum < 10 ? '0' + dayNum : dayNum}-${months[new Date().getMonth()]}`;
  }
  let date = new Date(d); 
  if (isNaN(date.getTime())) return d;
  return `${date.getDate() < 10 ? '0' + date.getDate() : date.getDate()}-${months[date.getMonth()]}`;
}

function parse(v){ return parseFloat(String(v||"").replace(/[₹, \s]/g,"")) || 0; }
function renderLoad(m) { document.getElementById("result").innerHTML = `<div class='empty'>${m}</div>`; }
</script>
</body>
</html>
