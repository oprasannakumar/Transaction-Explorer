<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#eef2f7,#f9fafb);
  padding:20px;
}
.card{
  max-width:1200px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
input,button{
  height:44px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:14px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover{background:#1e40af}
.table-wrap{
  margin-top:20px;
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:8px 10px;
  border-bottom:1px solid #e5e7eb;
  white-space:nowrap;
}
th{
  background:#f8fafc;
  font-weight:600;
}
.filter{
  width:100%;
  height:30px;
  font-size:12px;
  margin-top:4px;
}
tr:hover td{background:#f9fafb}
.empty{
  text-align:center;
  padding:24px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch</button>
    </div>
  </div>

  <div class="table-wrap" id="result">
    <div class="empty">Select date range</div>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwtG85JXMupK9FFaugSGJZNtHQLq7yufb7TACxfE5iUNyGSncYxxF_jhcXxielKerJO/exec";

let fullData = [];
let columns = [];

function fetchData(){
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  if(!from || !to){ alert("Select both dates"); return; }

  fetch(`${API_URL}?from=${from}&to=${to}`)
    .then(r=>r.json())
    .then(d=>{
      if(d.error){ alert(d.error); return; }
      fullData = d;
      columns = Object.keys(d[0] || {});
      renderTable(d);
    });
}

function renderTable(data){
  if(data.length === 0){
    document.getElementById("result").innerHTML =
      `<div class="empty">No transactions found</div>`;
    return;
  }

  let html = `<table><thead><tr>`;
  columns.forEach(c => html += `<th>${c.replace(/_/g,' ')}</th>`);
  html += `</tr><tr>`;

  // 🔥 Filter row with dropdowns
  columns.forEach((c,i)=>{
    html += `
      <th>
        <select class="filter" onchange="applyFilters()">
          <option value="">All</option>
          ${getUniqueValues(c).map(v=>`<option value="${escapeHtml(v)}">${v}</option>`).join("")}
        </select>
      </th>`;
  });

  html += `</tr></thead><tbody id="tbody"></tbody></table>`;
  document.getElementById("result").innerHTML = html;

  renderRows(data);
}

function renderRows(data){
  const tbody = document.getElementById("tbody");
  let html = "";

  data.forEach(r=>{
    html += `<tr>`;
    columns.forEach(c => html += `<td>${r[c] || ""}</td>`);
    html += `</tr>`;
  });

  tbody.innerHTML = html;
}

// 🔑 Collect unique values for a column
function getUniqueValues(column){
  return [...new Set(fullData.map(r => r[column]).filter(v => v !== "" && v !== null))]
          .sort();
}

// 🔍 Apply all column filters together
function applyFilters(){
  const selects = document.querySelectorAll(".filter");

  const filtered = fullData.filter(row => {
    return [...selects].every((sel, i) => {
      if(!sel.value) return true;
      return String(row[columns[i]] || "") === sel.value;
    });
  });

  renderRows(filtered);
}

// Prevent HTML breaking
function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
</script>


</body>
</html>
