<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

/* ===== BASE ===== */
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#eef2f7,#f9fafb);
  padding:12px;
}

.card{
  max-width:100%;
  margin:auto;
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 12px 28px rgba(0,0,0,.08);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.controls{
  display:flex;
  gap:8px;
}

input,button{
  height:36px;
  padding:0 10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:13px;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover{background:#1e40af}

/* ===== TABLE ===== */
.table-wrap{margin-top:14px;overflow-x:hidden}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:4px;
  font-size:12px;
  table-layout:fixed;
}

th{
  background:#f8fafc;
  font-weight:600;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:6px;
}

td{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:8px 10px;
  max-width:160px;
  white-space:normal;
}

tr:hover td{background:#eef2f7}

.empty{text-align:center;padding:20px;color:#6b7280}

/* ===== TOTAL ROW ===== */
tfoot td{
  background:#ecfeff;
  border:2px solid #67e8f9;
  font-weight:600;
}

/* ===== FILTER ===== */
.filter-box{position:relative;width:100%}
.filter-box > input{
  width:100%;
  height:28px;
  padding:4px 8px;
  font-size:11px;
  border-radius:6px;
  border:1px solid #d1d5db;
}

.filter-dropdown{
  position:absolute;
  top:32px;
  left:0;
  width:200px;
  background:#fff;
  border:1px solid #d1d5db;
  border-radius:8px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
  display:none;
  z-index:100;
}

.filter-header{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  font-size:10px;
}
.filter-header span{color:#2563eb;cursor:pointer}

.filter-search{
  width:100%;
  padding:6px 8px;
  border:none;
  border-bottom:1px solid #e5e7eb;
  font-size:12px;
}

.filter-list{max-height:160px;overflow:auto;padding:6px}

.filter-item{
  display:flex;
  gap:6px;
  font-size:12px;
  padding:3px;
}
.filter-item:hover{background:#f1f5f9}

.filter-count{font-size:10px;padding:4px 8px;color:#6b7280}

/* ===== MOBILE ===== */
@media (max-width:768px){
  table,thead,tbody,th,tr,tfoot{display:block}
  thead,tfoot{display:none}

  tbody tr{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:10px;
    margin-bottom:14px;
  }

  tbody td{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
  }

  tbody td::before{
    content:attr(data-label);
    font-weight:600;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch</button>
    </div>
  </div>

  <div class="table-wrap" id="result">
    <div class="empty">Select date range</div>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx7UZ48h0TvA53h3dP0mAqwM2yz88bngxYctvJOJ_OKLuHOcllc7IPZAxGN3N0U0lQJ/exec";

let fullData=[], columns=[], filters={};

function fetchData(){
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  if(!from||!to){alert("Select both dates");return;}

  fetch(`${API_URL}?from=${from}&to=${to}`)
    .then(r=>r.json())
    .then(d=>{
      fullData=d;
      columns=Object.keys(d[0]||{});
      filters={};
      renderTable();
    });
}

function renderTable(){
  let html=`<table>
    <thead>
      <tr>${columns.map(c=>`<th>${c.replace(/_/g,' ')}</th>`).join("")}</tr>
      <tr>${columns.map(c=>`
        <th>
          <div class="filter-box">
            <input readonly placeholder="Filter" onclick="toggleFilter(event,'${c}')">
            <div class="filter-dropdown" id="dd-${c}" onclick="event.stopPropagation()">
              <div class="filter-header">
                <span onclick="selectAll('${c}')">Select all</span>
                <span onclick="clearFilter('${c}')">Clear</span>
              </div>
              <input class="filter-search" placeholder="Search"
                     oninput="searchFilter('${c}',this.value)">
              <div class="filter-list" id="list-${c}"></div>
              <div class="filter-count" id="count-${c}"></div>
            </div>
          </div>
        </th>`).join("")}
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot><tr id="totalRow"></tr></tfoot>
  </table>`;

  result.innerHTML=html;
  columns.forEach(initFilter);
  applyFilters();
}

/* ===== FILTER LOGIC ===== */
function initFilter(col){
  const values=[...new Set(fullData.map(r=>r[col]).filter(v=>v))];
  filters[col]=new Set();

  document.getElementById(`list-${col}`).innerHTML=
    values.map(v=>`
      <label class="filter-item">
        <input type="checkbox" onchange="toggleValue('${col}','${encodeURIComponent(v)}')">
        ${v}
      </label>`).join("");

  document.getElementById(`count-${col}`).textContent=`Displaying ${values.length}`;
}

function toggleFilter(e,col){
  e.stopPropagation();
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.style.display="none");
  document.getElementById(`dd-${col}`).style.display="block";
}

function toggleValue(col,val){
  val=decodeURIComponent(val);
  filters[col].has(val)?filters[col].delete(val):filters[col].add(val);
  applyFilters();
}

function applyFilters(){
  const filtered=fullData.filter(r=>{
    return Object.keys(filters).every(c=>{
      if(!filters[c].size) return true;
      return filters[c].has(r[c]);
    });
  });
  renderRows(filtered);
}
function parseAmount(val){
  if(val === null || val === undefined) return 0;

  // Convert to string & clean currency formatting
  const cleaned = String(val)
    .replace(/₹/g, "")     // remove ₹
    .replace(/,/g, "")     // remove commas
    .trim();

  const num = parseFloat(cleaned);
  return isNaN(num) ? 0 : num;
}
function renderRows(data){
  let totalW = 0;
  let totalD = 0;

  tbody.innerHTML = data.map(r => {
    return `<tr>` + columns.map(c => {
      const v = r[c];

      // ✅ FIXED TOTAL CALCULATION
      if (c.toLowerCase().includes("withdraw")) {
        totalW += parseAmount(v);
      }
      if (c.toLowerCase().includes("deposit")) {
        totalD += parseAmount(v);
      }

      return `
        <td data-label="${c.replace(/_/g,' ')}">
          ${v !== undefined && v !== null && v !== "" ? v : "—"}
        </td>`;
    }).join("") + `</tr>`;
  }).join("");

  // ✅ Totals row
  totalRow.innerHTML = columns.map(c => {
    if (c.toLowerCase().includes("withdraw"))
      return `<td>₹${totalW.toLocaleString("en-IN",{minimumFractionDigits:2})}</td>`;
    if (c.toLowerCase().includes("deposit"))
      return `<td>₹${totalD.toLocaleString("en-IN",{minimumFractionDigits:2})}</td>`;
    return `<td>—</td>`;
  }).join("");
}

function searchFilter(col,term){
  term=term.toLowerCase();
  document.querySelectorAll(`#list-${col} label`)
    .forEach(l=>l.style.display=l.innerText.toLowerCase().includes(term)?"":"none");
}

function selectAll(col){
  const vals=[...new Set(fullData.map(r=>r[col]).filter(v=>v))];
  filters[col]=new Set(vals);
  document.querySelectorAll(`#list-${col} input`).forEach(i=>i.checked=true);
  applyFilters();
}

function clearFilter(col){
  filters[col].clear();
  document.querySelectorAll(`#list-${col} input`).forEach(i=>i.checked=false);
  applyFilters();
}

/* CLOSE FILTERS ON OUTSIDE CLICK */
document.addEventListener("click",()=>{
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.style.display="none");
});
</script>

</body>
</html>
