<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#eef2f7;
  padding:10px;
}

.card{
  width:100%;
  background:#fff;
  border-radius:12px;
  padding:12px;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.header{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:10px;
}

.controls{
  display:flex;
  gap:6px;
}

input,button{
  height:34px;
  padding:0 8px;
  border-radius:6px;
  border:1px solid #d1d5db;
  font-size:13px;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}

.table-wrap{
  margin-top:12px;
  overflow-x:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:auto;
  font-size:12px;
}

th,td{
  padding:5px 6px;
  border-bottom:1px solid #e5e7eb;
  vertical-align:top;
  text-align:left;
  white-space:normal;
  word-break:break-word;
}

th{
  background:#f8fafc;
  font-weight:600;
}

.filter-box{position:relative}

.filter-box input{
  height:24px;
  font-size:11px;
  padding:0 6px;
}

.filter-dropdown{
  position:absolute;
  top:26px;
  left:0;
  width:200px;
  background:#fff;
  border:1px solid #d1d5db;
  border-radius:6px;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  z-index:100;
  display:none;
}

.filter-header{
  display:flex;
  justify-content:space-between;
  padding:4px 8px;
  font-size:10px;
}

.filter-header span{
  color:#2563eb;
  cursor:pointer;
}

.filter-search{
  width:100%;
  padding:4px 8px;
  border:none;
  border-bottom:1px solid #e5e7eb;
  outline:none;
  font-size:11px;
}

.filter-list{
  max-height:160px;
  overflow:auto;
  padding:4px;
}

.filter-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:2px 4px;
  font-size:11px;
}

.filter-count{
  font-size:10px;
  padding:3px 8px;
  color:#6b7280;
}

/* ===== MOBILE ===== */
@media (max-width:768px){
  table, thead, tbody, tr{display:block}
  thead{display:none}

  tbody tr{
    background:#fff;
    margin-bottom:14px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:14px;
  }

  tbody td{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:10px;
    padding:7px 0;
    font-size:14px;
  }

  tbody td::before{
    content:attr(data-label);
    font-weight:600;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch</button>
    </div>
  </div>

  <div class="table-wrap" id="result">
    <div style="text-align:center;color:#6b7280;padding:16px">
      Select date range
    </div>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx7UZ48h0TvA53h3dP0mAqwM2yz88bngxYctvJOJ_OKLuHOcllc7IPZAxGN3N0U0lQJ/exec";

let fullData=[], columns=[], filters={};

function fetchData(){
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  if(!from||!to){alert("Select both dates");return;}

  fetch(`${API_URL}?from=${from}&to=${to}`)
    .then(r=>r.json())
    .then(d=>{
      fullData=d;
      columns=Object.keys(d[0]||{});
      filters={};
      renderTable();
    });
}

function renderTable(){
  let html=`<table><thead><tr>`;
  columns.forEach(c=>html+=`<th>${c.replace(/_/g,' ')}</th>`);
  html+=`</tr><tr>`;

  columns.forEach(c=>{
    html+=`
    <th>
      <div class="filter-box">
        <input readonly placeholder="Filter" onclick="toggleFilter(event,'${c}')">
        <div class="filter-dropdown" id="dd-${c}" onclick="event.stopPropagation()">
          <div class="filter-header">
            <span onclick="selectAll('${c}')">Select all</span>
            <span onclick="clearFilter('${c}')">Clear</span>
          </div>
          <input class="filter-search" placeholder="Search"
                 oninput="searchFilter('${c}',this.value)">
          <div class="filter-list" id="list-${c}"></div>
          <div class="filter-count" id="count-${c}"></div>
        </div>
      </div>
    </th>`;
  });

  html+=`</tr></thead><tbody id="tbody"></tbody></table>`;
  result.innerHTML=html;

  columns.forEach(initFilter);
  renderRows(fullData);
}

/* ===== FILTER INIT (ZERO SAFE) ===== */
function initFilter(col){
  const values=[...new Set(
    fullData.map(r => r[col])
      .filter(v => v !== null && v !== undefined)
  )].sort();

  filters[col]=new Set();

  const list=document.getElementById(`list-${col}`);
  list.innerHTML=values.map(v=>`
    <label class="filter-item">
      <input type="checkbox"
             onclick="event.stopPropagation()"
             onchange="toggleValue('${col}','${encodeURIComponent(v)}')">
      ${v === "" ? "—" : v}
    </label>
  `).join("");

  document.getElementById(`count-${col}`).textContent=`Displaying ${values.length}`;
}

/* ===== FILTER ACTIONS ===== */
function toggleFilter(e,col){
  e.stopPropagation();
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.style.display="none");
  document.getElementById(`dd-${col}`).style.display="block";
}

function toggleValue(col,val){
  val=decodeURIComponent(val);
  filters[col].has(val)?filters[col].delete(val):filters[col].add(val);
  applyFilters();
}

function applyFilters(){
  renderRows(fullData.filter(r=>{
    return Object.keys(filters).every(c=>{
      if(!filters[c].size) return true;
      return filters[c].has(r[c]);
    });
  }));
}

function renderRows(data){
  const tbody=document.getElementById("tbody");
  tbody.innerHTML=data.map(r=>
    `<tr>${columns.map(c=>`
      <td data-label="${c.replace(/_/g,' ')}">
        ${(r[c] === null || r[c] === undefined || r[c] === "") ? "—" : r[c]}
      </td>
    `).join("")}</tr>`
  ).join("");
}

function searchFilter(col,term){
  term=term.toLowerCase();
  document.querySelectorAll(`#list-${col} label`)
    .forEach(l=>l.style.display=l.innerText.toLowerCase().includes(term)?"":"none");
}

function selectAll(col){
  const vals=[...new Set(
    fullData.map(r=>r[col]).filter(v=>v !== null && v !== undefined)
  )];
  filters[col]=new Set(vals);
  document.querySelectorAll(`#list-${col} input`).forEach(i=>i.checked=true);
  applyFilters();
}

function clearFilter(col){
  filters[col].clear();
  document.querySelectorAll(`#list-${col} input`).forEach(i=>i.checked=false);
  applyFilters();
}

document.addEventListener("click",()=>{
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.style.display="none");
});
</script>

</body>
</html>
