<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

/* ===== BASE ===== */
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#eef2f7;
  padding:12px;
}

.card{
  width:100%;
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 12px 28px rgba(0,0,0,.08);
}

.header{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.controls{
  display:flex;
  gap:8px;
}

input,button{
  height:40px;
  padding:0 12px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:14px;
  width:100%;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
}

/* ===== TABLE ===== */
.table-wrap{
  margin-top:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}

/* =========================
   MOBILE CARD VIEW
========================= */
@media (max-width:768px){

  table, tbody, tr{
    display:block;
    width:100%;
  }

  tbody tr{
    background:#fff;
    margin-bottom:16px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
  }

  tbody td{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:8px 0;            /* ✅ uniform vertical spacing */
    border:none;
    font-size:14px;
    min-height:32px;          /* ✅ same height even if empty */
    align-items:center;
  }

  tbody td::before{
    content:attr(data-label);
    font-weight:600;
    color:#374151;
    white-space:nowrap;
  }

  tbody td{
    text-align:left;
    word-break:normal;
    overflow-wrap:anywhere;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch</button>
    </div>
  </div>

  <div class="table-wrap" id="result">
    <div style="text-align:center;color:#6b7280;padding:16px">
      Select date range
    </div>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx7UZ48h0TvA53h3dP0mAqwM2yz88bngxYctvJOJ_OKLuHOcllc7IPZAxGN3N0U0lQJ/exec";

let fullData=[], columns=[];

function fetchData(){
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  if(!from||!to){alert("Select both dates");return;}

  fetch(`${API_URL}?from=${from}&to=${to}`)
    .then(r=>r.json())
    .then(d=>{
      fullData=d;
      columns=Object.keys(d[0]||{});
      renderTable();
    });
}

function renderTable(){
  if(!fullData.length){
    result.innerHTML=`<div style="text-align:center;padding:16px;color:#6b7280">No transactions found</div>`;
    return;
  }

  let html=`<table><tbody id="tbody"></tbody></table>`;
  result.innerHTML=html;
  renderRows(fullData);
}

function renderRows(data){
  tbody.innerHTML=data.map(r=>
    `<tr>${columns.map(c=>`
      <td data-label="${c.replace(/_/g,' ')}">
        ${r[c] ? r[c] : "—"}
      </td>
    `).join("")}</tr>`
  ).join("");
}
</script>

</body>
</html>
