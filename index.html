<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AERO Finance Pro | Cyber Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root { 
    --neon-blue: #00d2ff; --neon-cyan: #00ffff; --neon-red: #ff0055; --neon-green: #00ff88;
    --cyber-black: #0a0b10; --border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Inter', sans-serif; background: #0a0b10; color: #fff; min-height: 100vh; padding: 20px; 
    background: radial-gradient(circle at 50% 0%, #1a1c2c, #0a0b10);
  }
  .wrapper { max-width: 1440px; margin: 0 auto; }
  
  /* --- Glass Navigation --- */
  .top-nav { 
    backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.03); 
    border-radius: 20px; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
    border: 1px solid var(--border); margin-bottom: 30px; position: sticky; top: 10px; z-index: 1000;
  }
  .brand { display: flex; align-items: center; gap: 15px; cursor: pointer; }
  .logo { 
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan)); 
    width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-weight: 700; box-shadow: 0 0 15px var(--neon-blue); color: #000;
  }
  .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 2px; }
  
  .filter-hub { display: flex; gap: 10px; }
  input[type="date"] { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; color: #fff; padding: 10px; font-size: 12px; outline: none; }
  button { 
    background: var(--neon-blue); color: #000; font-weight: 800; padding: 10px 20px; border: none; border-radius: 10px; 
    cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 11px; letter-spacing: 1px;
  }
  button:hover:not(:disabled) { box-shadow: 0 0 20px var(--neon-blue); transform: translateY(-2px); }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* --- Neon Metrics --- */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .neon-card { 
    background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 20px; padding: 25px;
    transition: 0.3s; position: relative;
  }
  .neon-card.interactive:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--neon-blue); cursor: pointer; }
  .label { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; font-weight: 700; }
  .value { font-family: 'Orbitron', sans-serif; font-size: 22px; margin: 8px 0; }

  /* --- Cyber Table --- */
  .container { background: rgba(0,0,0,0.3); border-radius: 25px; border: 1px solid var(--border); padding: 20px; min-height: 500px; }
  .sheet-title { font-family: 'Orbitron', sans-serif; font-size: 11px; margin-bottom: 20px; color: var(--neon-cyan); display: flex; justify-content: space-between; padding: 0 10px; }
  
  .table-scroll { overflow-x: auto; border-radius: 15px; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 15px 20px; text-align: left; font-size: 10px; text-transform: uppercase; color: rgba(255,255,255,0.4); border-bottom: 1px solid var(--border); }
  td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 13px; }
  
  .row-interactive { cursor: pointer; transition: 0.2s; }
  .row-interactive:hover { background: rgba(255,255,255,0.03); }
  .row-selected { 
    background: rgba(0, 210, 255, 0.1) !important; 
    border-left: 4px solid var(--neon-cyan);
    box-shadow: inset 5px 0 15px rgba(0, 210, 255, 0.1);
  }

  .bank-tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .tag-hdfc { color: var(--neon-blue); } .tag-sbi { color: var(--neon-green); } .tag-icici { color: #ffa500; }
  
  .amt-dep { color: var(--neon-green); font-weight: 700; }
  .amt-with { color: var(--neon-red); font-weight: 700; }

  .empty { text-align: center; padding: 150px; opacity: 0.3; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 5px; }
</style>
</head>
<body onload="initDashboard()">

<div class="wrapper">
  <nav class="top-nav">
    <div class="brand" onclick="location.reload()"><div class="logo">₹</div><h1>AERO SYSTEM</h1></div>
    <div class="filter-hub">
      <input type="date" id="from"> <input type="date" id="to">
      <button onclick="fetchData()">Initialize</button>
      <button id="traceBtn" onclick="traceSelected()" style="display:none; background:var(--neon-green);">Global Sync (<span id="trace-count">0</span>)</button>
    </div>
  </nav>

  <section class="metrics-grid">
    <div class="neon-card interactive" onclick="fetchRange('Savings')"><span class="label">Liquidity Pool 🔗</span><div id="raw-savings" class="value">₹0.00</div></div>
    <div class="neon-card interactive" onclick="fetchRange('CC')"><span class="label">Credit Exposure 🔗</span><div id="raw-cc" class="value">₹0.00</div></div>
    <div class="neon-card" style="border: 1px solid var(--neon-blue);"><span class="label" style="color:var(--neon-blue)">Net Portfolio</span><div id="net-balance" class="value">₹0.00</div></div>
    <div class="neon-card"><span class="label">Session In</span><div id="total-dep" class="value amt-dep">₹0.00</div></div>
    <div class="neon-card"><span class="label">Session Out</span><div id="total-with" class="value amt-with">₹0.00</div></div>
  </section>

  <main id="result" class="container">
    <div class="empty">SYSTEM OFFLINE: AWAITING INPUT</div>
  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw4x4_aevBLrEuWiHFex84Cz_EiFuThFPO5jgxWaGUYQYOTsbNHIPhUe8KJ1GVpLX9zfg/exec";
let selectionSet = new Set(), isNamedRangeView = false, currentRangeName = '', currentActiveName = '', currentStats = { net: 0, rawS: 0, rawC: 0 };

async function initDashboard() {
  const r = await fetch(API_URL, { redirect: "follow" });
  const res = await r.json();
  currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
  updateUI(0, 0);
}

async function fetchData() {
  isNamedRangeView = false; currentActiveName = ''; selectionSet.clear();
  const f = document.getElementById("from").value, t = document.getElementById("to").value;
  if(!f || !t) return;
  renderLoad("BOOTING MASTER STATEMENT...");
  const r = await fetch(`${API_URL}?from=${f}&to=${t}`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

async function fetchRange(name) {
  isNamedRangeView = true; currentRangeName = name; currentActiveName = ''; selectionSet.clear();
  renderLoad(`SCANNING ${name} REGISTRY...`);
  const r = await fetch(`${API_URL}?rangeName=${name}`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

function toggleSelection(rowElement, refId) {
  if (isNamedRangeView) {
    traceAccount(refId);
    return;
  }
  if (selectionSet.has(refId)) {
    selectionSet.delete(refId);
    rowElement.classList.remove('row-selected');
  } else {
    selectionSet.add(refId);
    rowElement.classList.add('row-selected');
  }
  updateSelectCount();
}

async function traceAccount(val) {
  currentActiveName = val; isNamedRangeView = false; selectionSet.clear();
  const source = (currentRangeName === 'CC') ? 'CC' : 'Account';
  renderLoad(`TRACING ENTITY: ${val}...`);
  const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(val)}&source=${source}`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

async function traceSelected() {
  if (selectionSet.size === 0) return;
  const terms = Array.from(selectionSet).join(","); 
  isNamedRangeView = false; currentActiveName = ''; selectionSet.clear();
  renderLoad("UNIVERSAL SYNC IN PROGRESS...");
  const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(terms)}&source=Reference`, { redirect: "follow" });
  const res = await r.json();
  renderData(res.transactions);
}

function renderData(data) {
  const resultDiv = document.getElementById("result");
  if(!data || data.length === 0) return resultDiv.innerHTML = "<div class='empty'>ZERO DATA PACKETS</div>";
  resultDiv.innerHTML = "";
  let gDep = 0, gWith = 0;
  
  document.getElementById("traceBtn").style.display = isNamedRangeView ? "none" : "inline-flex";
  updateSelectCount();

  const grouped = data.reduce((acc, item) => { if(!acc[item.SheetSource]) acc[item.SheetSource] = []; acc[item.SheetSource].push(item.data); return acc; }, {});

  Object.keys(grouped).forEach(sheet => {
    const rows = grouped[sheet], headers = rows[0].map(p => p.k);
    const div = document.createElement("div"); div.className = "sheet-block";
    
    let displayTitle = isNamedRangeView ? `${currentRangeName} REGISTRY` : `SHEET: ${sheet}`;
    if (currentActiveName) displayTitle = `LOGS: ${currentActiveName} (via ${sheet})`;

    div.innerHTML = `<div class="sheet-title"><span>> ${displayTitle.toUpperCase()}</span><span>[${rows.length} UNITS]</span></div>
    <div class="table-scroll"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row => {
      const refId = row[row.length - 1].v;
      const primaryVal = row[0].v;
      const passId = isNamedRangeView ? primaryVal : refId;
      
      return `<tr class="row-interactive" onclick="toggleSelection(this, '${passId}')">${row.map((p, i) => {
        let val = p.v, cls = "";
        if(p.k.toLowerCase().includes('from')) {
           let tag = val.toLowerCase().includes('hdfc') ? 'tag-hdfc' : val.toLowerCase().includes('sbi') ? 'tag-sbi' : 'tag-icici';
           val = `<span class="bank-tag ${tag}">${val}</span>`;
        }
        if(i === 0 || p.k.toLowerCase().includes("date")) val = formatDate(val);
        else if (!isNaN(parseFloat(String(val).replace(/[₹, \s]/g, "")))) val = formatCurr(val);
        if(p.k.toLowerCase().includes("deposit")) { gDep += parse(p.v); cls = "amt-dep"; }
        if(p.k.toLowerCase().includes("withdraw")) { gWith += parse(p.v); cls = "amt-with"; }
        return `<td class="${cls}">${val || "—"}</td>`;
      }).join("")}</tr>`;
    }).join("")}</tbody></table></div>`;
    resultDiv.appendChild(div);
  });
  updateUI(gDep, gWith);
}

function updateSelectCount() {
  const c = selectionSet.size;
  document.getElementById("trace-count").innerText = c;
  document.getElementById("traceBtn").disabled = (c === 0);
}

function updateUI(d, w) {
  document.getElementById("raw-savings").innerText = formatCurr(currentStats.rawS);
  document.getElementById("raw-cc").innerText = formatCurr(currentStats.rawC);
  document.getElementById("net-balance").innerText = formatCurr(currentStats.net);
  document.getElementById("total-dep").innerText = formatCurr(d);
  document.getElementById("total-with").innerText = formatCurr(w);
}

function formatCurr(v) { let n = parseFloat(String(v || "").replace(/[₹, \s]/g, "")); return isNaN(n) ? v : "₹" + n.toLocaleString('en-IN', { minimumFractionDigits: 2 }); }
function formatDate(d) { let date = new Date(d); return isNaN(date.getTime()) ? d : `${date.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][date.getMonth()]} ${date.getFullYear()}`; }
function parse(v){ return parseFloat(String(v||"").replace(/[₹, \s]/g,"")) || 0; }
function renderLoad(m) { document.getElementById("result").innerHTML = `<div class="empty"><div style="color:var(--neon-cyan); text-shadow:0 0 15px var(--neon-cyan);">${m}</div></div>`; }
</script>
</body>
</html>
