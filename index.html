<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Financial Explorer Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0; font-family:'Inter',sans-serif; background:#f3f6fb; padding:12px;}
  .card{background:#fff; border-radius:16px; padding:24px; box-shadow:0 10px 25px rgba(0,0,0,.05); max-width: 1400px; margin: auto; min-height: 85vh;}
  .header{display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; margin-bottom: 24px; border-bottom: 1px solid #f1f5f9; padding-bottom: 20px;}
  .controls{display:flex; gap:10px; align-items: center; flex-wrap: wrap;}
  
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
  .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 12px; transition: all 0.2s ease; }
  .clickable-card { cursor: pointer; border-bottom: 3px solid transparent; }
  .clickable-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); background: #fff; }
  
  .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 6px; }
  
  .welcome-box { text-align: center; padding: 60px 20px; color: #64748b; background: #fcfdfe; border: 2px dashed #e2e8f0; border-radius: 16px; margin-top: 20px; }
  
  .sheet-group { margin-bottom: 30px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fff; animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .sheet-header { background: #0f172a; color: #fff; padding: 12px 18px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
  
  input, button { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 13px; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-weight: 500; }
  button:hover:not(:disabled) { background: #1e40af; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  
  .btn-delete { background: #ef4444; }
  .btn-trace-bulk { background: #10b981; }
  .count-badge { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f8fafc; padding: 12px 15px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #475569; }
  td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
  
  .range-row { cursor: pointer; transition: background 0.2s; }
  .range-row:hover { background-color: #f0f9ff !important; }

  .amt-deposit { color: #10b981; font-weight: 600; }
  .amt-withdraw { color: #ef4444; font-weight: 600; }
  
  @media(max-width:768px){
    .header { flex-direction: column; align-items: stretch; }
    table, thead, tbody, th, tr { display: block; }
    thead { display: none; }
    tbody td { display: flex; justify-content: space-between; padding: 10px 15px; border: none; }
    tbody td::before { content: attr(data-label); font-weight: 600; color: #64748b; }
  }
</style>
</head>
<body onload="initDashboard()">

<div class="card">
  <div class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:40px; height:40px; background:#2563eb; border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;">₹</div>
      <h2 style="margin:0; font-size:20px; color:#0f172a;">Unified Statement Explorer</h2>
    </div>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch Data</button>
      <button id="traceBtn" onclick="traceSelected()" class="btn-trace-bulk" disabled style="display:none;">
        Trace Selected <span id="trace-count" class="count-badge">0</span>
      </button>
      <button id="deleteBtn" onclick="deleteSelected()" class="btn-delete" disabled style="display:none;">
        Delete Selected <span id="del-count" class="count-badge">0</span>
      </button>
    </div>
  </div>

  <div id="summary" class="summary-bar">
    <div class="stat-card clickable-card" style="border-left: 4px solid #8b5cf6;" onclick="fetchRange('Savings')">
      <div class="stat-label">Total Savings Amount 🔗</div>
      <div id="raw-savings" class="stat-value">₹0.00</div>
    </div>
    <div class="stat-card clickable-card" style="border-left: 4px solid #ef4444;" onclick="fetchRange('CC')">
      <div class="stat-label">Used Credit Limits 🔗</div>
      <div id="raw-cc" class="stat-value">₹0.00</div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #3b82f6; background: #f0f7ff;">
      <div class="stat-label">Net Available Amount</div>
      <div id="net-balance" class="stat-value">₹0.00</div>
    </div>
    <div class="stat-card"><div class="stat-label">Deposits (Selection)</div><div id="total-dep" class="stat-value">₹0.00</div></div>
    <div class="stat-card"><div class="stat-label">Withdrawals (Selection)</div><div id="total-with" class="stat-value">₹0.00</div></div>
  </div>

  <div id="result">
    <div class="welcome-box">
      <h3>Ready to Explore</h3>
      <p>Select a date range or tap a card to begin. Filter logic optimized for partial matching.</p>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxeyI-iKfYu216UnB-6HBW1uuIwTzjykzOdLXaWK2JzxEl7XUF5ytr9hYWKmq4Batdtgg/exec";
let deleteSet = new Set();
let isNamedRangeView = false;
let currentRangeName = ''; // Tracks if we are in CC or Savings view
let currentStats = { net: 0, rawS: 0, rawC: 0 };

async function initDashboard() {
  try {
    const r = await fetch(API_URL, { redirect: "follow" });
    const res = await r.json();
    currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
    updateSummary(0, 0);
  } catch(e) { renderMsg("Connection failed.", true); }
}

function formatDate(dateStr) {
  const date = new Date(dateStr);
  if (isNaN(date.getTime())) return dateStr; 
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${date.getDate()}-${months[date.getMonth()]}-${date.getFullYear()}`;
}

function formatCurrency(val) {
  const num = parseFloat(String(val || "").replace(/[₹, \s]/g, ""));
  if (isNaN(num)) return val;
  return "₹" + num.toLocaleString('en-IN', { minimumFractionDigits: 2 });
}

function parseAmount(v){
  return parseFloat(String(v||"").replace(/[₹, \s]/g,"")) || 0;
}

async function fetchData() {
  isNamedRangeView = false;
  currentRangeName = '';
  const from = document.getElementById("from").value, to = document.getElementById("to").value;
  if(!from || !to) return alert("Select dates");
  renderLoading("Fetching...");
  try {
    const r = await fetch(`${API_URL}?from=${from}&to=${to}`, { redirect: "follow" });
    const res = await r.json();
    currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
    renderData(res.transactions);
  } catch(e) { renderMsg("Error fetching data.", true); }
}

async function fetchRange(name) {
  isNamedRangeView = true;
  currentRangeName = name;
  renderLoading(`Loading ${name}...`);
  try {
    const r = await fetch(`${API_URL}?rangeName=${name}`, { redirect: "follow" });
    const res = await r.json();
    currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
    renderData(res.transactions);
  } catch(e) { renderMsg(`Could not load range.`, true); }
}

async function traceSelected() {
  if (deleteSet.size === 0) return;
  isNamedRangeView = false;
  const terms = Array.from(deleteSet).join(",");
  renderLoading(`Tracing Selection...`);
  try {
    const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(terms)}`, { redirect: "follow" });
    const res = await r.json();
    currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
    renderData(res.transactions);
  } catch(e) { renderMsg("Error during trace.", true); }
}

async function traceRow(elementValue) {
  if (!elementValue || elementValue === "—") return;
  
  // Detect source for CC-specific filtering
  const source = (isNamedRangeView && currentRangeName === 'CC') ? 'CC' : 'Other';
  
  isNamedRangeView = false;
  renderLoading(`Filtering for: ${elementValue}...`);
  try {
    const r = await fetch(`${API_URL}?action=trace&refId=${encodeURIComponent(elementValue)}&source=${source}`, { redirect: "follow" });
    const res = await r.json();
    currentStats = { net: res.netBalance, rawS: res.rawSavings, rawC: res.rawCC };
    renderData(res.transactions);
  } catch(e) { renderMsg("Error fetching statement.", true); }
}

function renderData(data) {
  const resultDiv = document.getElementById("result");
  if(!data || data.length === 0) {
    updateSummary(0,0);
    return renderMsg("No records found.");
  }
  resultDiv.innerHTML = "";
  let gDep = 0, gWith = 0;

  document.getElementById("traceBtn").style.display = isNamedRangeView ? "none" : "inline-flex";
  document.getElementById("deleteBtn").style.display = isNamedRangeView ? "none" : "inline-flex";
  updateSelection();

  const grouped = data.reduce((acc, item) => {
    if(!acc[item.SheetSource]) acc[item.SheetSource] = [];
    acc[item.SheetSource].push(item.data);
    return acc;
  }, {});

  Object.keys(grouped).forEach(sheetName => {
    const rows = grouped[sheetName];
    const headers = rows[0].map(pair => pair.k); 
    const container = document.createElement("div");
    container.className = "sheet-group";
    container.innerHTML = `
      <div class="sheet-header"><span>📄 Source: ${sheetName}</span><span>${rows.length} records</span></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              ${!isNamedRangeView ? `<th style="width:40px;"><input type="checkbox" onclick="toggleSheet(this, '${sheetName}')"></th>` : ''}
              ${headers.map(h => `<th>${h}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${rows.map(rowPairs => {
              const firstColValue = rowPairs[0].v; 
              const rowAttr = isNamedRangeView ? `class="range-row" onclick="traceRow('${firstColValue}')" title="Filter by ${firstColValue}"` : "";
              
              return `<tr ${rowAttr}>
                ${!isNamedRangeView ? `<td><input type="checkbox" class="cb-${sheetName}" data-ref="${firstColValue}" onchange="updateSelection()"></td>` : ''}
                ${rowPairs.map((pair, i) => {
                  let val = pair.v;
                  let className = "";
                  if(i === 0 || pair.k.toLowerCase().includes("date")) val = formatDate(val);
                  else if (!isNaN(parseFloat(String(val).replace(/[₹, \s]/g, "")))) val = formatCurrency(val);
                  if(pair.k.toLowerCase().includes("deposit")) { gDep += parseAmount(pair.v); className = "amt-deposit"; }
                  if(pair.k.toLowerCase().includes("withdraw")) { gWith += parseAmount(pair.v); className = "amt-withdraw"; }
                  return `<td data-label="${pair.k}" class="${className}">${val || "—"}</td>`;
                }).join("")}
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
    resultDiv.appendChild(container);
  });
  updateSummary(gDep, gWith);
}

function updateSummary(dep, withdr) {
  document.getElementById("raw-savings").innerText = formatCurrency(currentStats.rawS);
  document.getElementById("raw-cc").innerText = formatCurrency(currentStats.rawC);
  document.getElementById("net-balance").innerText = formatCurrency(currentStats.net);
  document.getElementById("total-dep").innerText = formatCurrency(dep);
  document.getElementById("total-with").innerText = formatCurrency(withdr);
}

function updateSelection() {
  deleteSet.clear();
  if(!isNamedRangeView) {
    document.querySelectorAll('input[data-ref]:checked').forEach(cb => {
      const ref = cb.getAttribute("data-ref");
      if(ref && ref !== "—") deleteSet.add(ref);
    });
  }
  const dBtn = document.getElementById("deleteBtn");
  const tBtn = document.getElementById("traceBtn");
  const count = deleteSet.size;
  document.getElementById("del-count").innerText = document.getElementById("trace-count").innerText = count;
  dBtn.disabled = tBtn.disabled = (count === 0);
}

function toggleSheet(master, sName) {
  document.querySelectorAll(`.cb-${sName}`).forEach(cb => cb.checked = master.checked);
  updateSelection();
}

async function deleteSelected() {
  const ids = Array.from(deleteSet);
  if(!confirm(`Delete ${ids.length} records?`)) return;
  try {
    await fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ ids: ids }) });
    alert("Deleted!"); location.reload();
  } catch(e) { alert("Error."); }
}
function renderMsg(m, isErr) { document.getElementById("result").innerHTML = `<div style="text-align:center; padding:60px; color:${isErr?'red':'#64748b'};"><h4>${isErr?'Error':'Note'}</h4><p>${m}</p></div>`; }
function renderLoading(m) { document.getElementById("result").innerHTML = `<div style="text-align:center; padding:100px 0;"><div style="color:#2563eb; font-weight:600;">${m}</div></div>`; }
</script>
</body>
</html>
