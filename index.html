<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#eef2f7;
  padding:10px;
}

.card{
  width:100%;
  background:#fff;
  border-radius:12px;
  padding:12px;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.header{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:10px;
}

.controls{
  display:flex;
  gap:6px;
}

input,button{
  height:34px;
  padding:0 8px;
  border-radius:6px;
  border:1px solid #d1d5db;
  font-size:13px;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}

.table-wrap{
  margin-top:12px;
  overflow-x:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,td{
  padding:5px 6px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  white-space:normal;
  word-break:break-word;
}

th{
  background:#f8fafc;
  font-weight:600;
}

/* ===== MOBILE ===== */
@media (max-width:768px){
  table, thead, tbody, tr{display:block}
  thead{display:none}

  tbody tr{
    background:#fff;
    margin-bottom:14px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:14px;
  }

  tbody td{
    display:grid;
    grid-template-columns:130px 1fr;
    gap:10px;
    padding:7px 0;
    font-size:14px;
  }

  tbody td::before{
    content:attr(data-label);
    font-weight:600;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>Transaction Explorer</h2>
    <div class="controls">
      <input type="date" id="from">
      <input type="date" id="to">
      <button onclick="fetchData()">Fetch</button>
    </div>
  </div>

  <div class="table-wrap" id="result">
    <div style="text-align:center;color:#6b7280;padding:16px">
      Select date range
    </div>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx7UZ48h0TvA53h3dP0mAqwM2yz88bngxYctvJOJ_OKLuHOcllc7IPZAxGN3N0U0lQJ/exec";

/* 👇 EXACT COLUMN NAMES (MATCH SHEET HEADERS) */
const AMOUNT_COLUMNS = [
  "Withdrawn Amount",
  "Deposit Amount"
];

let fullData=[], columns=[];

function fetchData(){
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  if(!from||!to){alert("Select both dates");return;}

  fetch(`${API_URL}?from=${from}&to=${to}`)
    .then(r=>r.json())
    .then(d=>{
      fullData=d;
      columns=Object.keys(d[0]||{});
      renderTable();
    });
}

function renderTable(){
  let html=`<table><thead><tr>`;
  columns.forEach(c=>html+=`<th>${c}</th>`);
  html+=`</tr></thead><tbody id="tbody"></tbody></table>`;
  result.innerHTML=html;
  renderRows(fullData);
}

function renderRows(data){
  const tbody=document.getElementById("tbody");

  tbody.innerHTML=data.map(r=>
    `<tr>${
      columns.map(c=>{
        let val = r[c];

        /* ✅ FORCE AMOUNT VISIBILITY */
        if (AMOUNT_COLUMNS.includes(c)) {
          if (val === "" || val === null || val === undefined) {
            val = "0";
          }
        } else {
          if (val === "" || val === null || val === undefined) {
            val = "—";
          }
        }

        return `
          <td data-label="${c}">
            ${val}
          </td>`;
      }).join("")
    }</tr>`
  ).join("");
}
</script>

</body>
</html>
